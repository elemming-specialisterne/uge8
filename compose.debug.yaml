# Debug configuration for both ProductService and OrderService
# Use with: docker-compose -f docker-compose.yml -f compose.debug.yaml up

version: '3.8'
services:
  productservice:
    build:
      context: ./uge6_ProductService/ProductService/
      dockerfile: ProductService/Dockerfile
      args:
        - configuration=Debug
    ports:
      - "7125:7125"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=appdb;Username=app;Password=secret;Pooling=true
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
    networks:
      - app-network
    depends_on:
      - db

  orderservice:
    build:
      context: ./uge8_OrderDocker
      dockerfile: OrderService/Dockerfile
      args:
        - configuration=Debug
    ports:
      - "5028:5028"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=appdb;User Id=app;Password=secret;
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
    networks:
      - app-network
    depends_on:
      - db

networks:
  app-network:
    driver: bridge
